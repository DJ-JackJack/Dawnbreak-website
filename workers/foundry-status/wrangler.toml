name = "dawnbreak-foundry-status"
main = "worker.js"
compatibility_date = "2026-09-01"

# Served at https://dawnbreak.ahvantir.world/api/foundry-status.
# Intercepts only that path; the rest of the site stays on GitHub Pages.
# Requires the ahvantir.world zone to be on this Cloudflare account (it is —
# the play tunnel is already there).
routes = [
  { pattern = "dawnbreak.ahvantir.world/api/foundry-status", zone_name = "ahvantir.world" }
]
